name: balena PR build (test fleets)

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # Only run on PRs from the same repo — fork PRs lack access to repo secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Deploy to aarch64 (${{ secrets.BALENA_FLEET_PR_AARCH64 }})
        uses: balena-io/deploy-to-balena-action@578f912fe5172b3147c850fc3f1327b006598b68 # v2.2.12
        with:
          balena_token: ${{ secrets.BALENA_API_TOKEN }}
          fleet: ${{ secrets.BALENA_FLEET_PR_AARCH64 }}
      - name: Deploy to amd64 (${{ secrets.BALENA_FLEET_PR_AMD64 }})
        if: ${{ !cancelled() }}
        uses: balena-io/deploy-to-balena-action@578f912fe5172b3147c850fc3f1327b006598b68 # v2.2.12
        with:
          balena_token: ${{ secrets.BALENA_API_TOKEN }}
          fleet: ${{ secrets.BALENA_FLEET_PR_AMD64 }}
      - name: Deploy to armv7hf (${{ secrets.BALENA_FLEET_PR_ARMV7HF }})
        if: ${{ !cancelled() }}
        uses: balena-io/deploy-to-balena-action@578f912fe5172b3147c850fc3f1327b006598b68 # v2.2.12
        with:
          balena_token: ${{ secrets.BALENA_API_TOKEN }}
          fleet: ${{ secrets.BALENA_FLEET_PR_ARMV7HF }}
