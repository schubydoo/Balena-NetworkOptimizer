name: Build validation

# Reliable, GitHub-hosted "does it actually build" gate for PRs.
#
# Uses buildx with push:false so it never touches balena's cloud builder.
# Unlike balena-pr.yml (which can hang on an external service and is therefore
# unsafe as a required check), this runs entirely on the GitHub runner with a
# hard timeout — making it safe to require in branch protection.
#
# amd64-only on PRs for speed; the full multi-arch build is proven separately
# by publish-ghcr.yml on tag pushes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build network-optimizer (amd64)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: network-optimizer
          file: network-optimizer/Dockerfile.template
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=network-optimizer
          cache-to: type=gha,mode=max,scope=network-optimizer

      - name: Build network-optimizer-speedtest (amd64)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: network-optimizer-speedtest
          file: network-optimizer-speedtest/Dockerfile.template
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=speedtest
          cache-to: type=gha,mode=max,scope=speedtest
