name: balena deploy (prod)

# Trigger on tag pushes produced by release.yml.
# `workflow_dispatch` is the manual escape hatch for redeploys when the tag
# already exists and you want to rebuild without retagging.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (must match VERSION file). Used for ad-hoc redeploys."
        required: true

concurrency:
  group: balena-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_type == 'tag' && github.ref || format('refs/tags/v{0}', inputs.version) }}

      - name: Validate version alignment
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${{ inputs.version }}"
          fi
          TAG_VERSION="${TAG#v}"
          FILE_VERSION="$(cat VERSION | tr -d '[:space:]')"
          YAML_VERSION="$(awk '/^version:/ {print $2; exit}' balena.yml | tr -d '[:space:]')"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION  VERSION=$FILE_VERSION  balena.yml=$YAML_VERSION  package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ] \
              || [ "$FILE_VERSION" != "$YAML_VERSION" ] \
              || [ "$YAML_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch. Tag, VERSION, balena.yml, and package.json must all match."
            exit 1
          fi

      - name: Deploy to production fleet
        id: deploy
        uses: balena-io/deploy-to-balena-action@v2.2.0
        with:
          balena_token: ${{ secrets.BALENA_API_TOKEN }}
          fleet: ${{ secrets.BALENA_FLEET_PROD }}

      - if: steps.deploy.outputs.release_id != ''
        run: echo "release_id=${{ steps.deploy.outputs.release_id }} version=${{ steps.deploy.outputs.version }}"

      - name: Set release note on balena fleet
        if: steps.deploy.outputs.release_id != ''
        run: node scripts/set-release-note.mjs
        env:
          BALENA_API_TOKEN: ${{ secrets.BALENA_API_TOKEN }}
          BALENA_FLEET: ${{ secrets.BALENA_FLEET_PROD }}
