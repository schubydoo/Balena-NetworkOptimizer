name: Release

# Manually triggered (workflow_dispatch). Scans every commit on main since
# the last vX.Y.Z tag, collects their `Change-type:` trailers, picks the
# highest level (major > minor > patch), and cuts a single release that
# bundles all pending Change-typed commits. Housekeeping merges (no
# Change-type) are ignored. If no commit since the last tag carries a
# trailer the workflow exits at the "detect" step.
#
# This replaces the per-push trigger so multiple Renovate PRs merged in
# the same release window batch into one release instead of N. Future:
# revisit release-please (https://github.com/googleapis/release-please)
# for a release-PR-driven model.

on:
  workflow_dispatch: {}

permissions:
  # GITHUB_TOKEN needs no write scope: the version-bump commit and tag are
  # pushed with RELEASE_TOKEN (a PAT) configured on actions/checkout, not
  # with GITHUB_TOKEN. Keep this minimal (Scorecard TokenPermissions).
  contents: read

concurrency:
  # Guard against double-clicks of "Run workflow" racing on the tag push.
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: package.json

      - name: Detect highest Change-type since last tag
        id: detect
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
            echo "Scanning ${RANGE}"
          else
            RANGE="HEAD"
            echo "No prior tag — scanning all of HEAD"
          fi
          TYPES=$(git log $RANGE --pretty=%B | grep -oP '(?<=Change-type: )(major|minor|patch)' || true)
          if echo "$TYPES" | grep -qx 'major'; then
            CHANGE_TYPE=major
          elif echo "$TYPES" | grep -qx 'minor'; then
            CHANGE_TYPE=minor
          elif echo "$TYPES" | grep -qx 'patch'; then
            CHANGE_TYPE=patch
          else
            CHANGE_TYPE=""
          fi
          echo "change_type=${CHANGE_TYPE}" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGE_TYPE" ]; then
            echo "No Change-type trailers in range — skipping release."
          else
            echo "Highest Change-type in range: $CHANGE_TYPE"
            echo "All trailers found:"
            echo "$TYPES" | sort -u
          fi

      - name: Calculate new version
        if: steps.detect.outputs.change_type != ''
        id: version
        run: |
          CURRENT=$(cat VERSION | tr -d '[:space:]')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ steps.detect.outputs.change_type }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"
          echo "Bumping ${CURRENT} → ${NEW}"

      - name: Update version files
        if: steps.detect.outputs.change_type != ''
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          echo "$NEW_VERSION" > VERSION
          jq --arg v "$NEW_VERSION" '.version = $v' package.json > package.json.tmp \
            && mv package.json.tmp package.json
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" balena.yml

      - name: Prepend CHANGELOG entry
        if: steps.detect.outputs.change_type != ''
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          # Collect commits since last tag (or all if no tag yet)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty="- %s" --no-merges)
          else
            COMMITS=$(git log --pretty="- %s" --no-merges)
          fi
          ENTRY="## v${NEW_VERSION}\n${COMMITS}"
          if [ -f CHANGELOG.md ]; then
            BODY=$(cat CHANGELOG.md)
            printf '%s\n\n%s\n' "# Changelog" "${ENTRY}" > CHANGELOG.md
            echo "$BODY" | grep -v '^# Changelog' >> CHANGELOG.md
          else
            printf '# Changelog\n\n%s\n' "${ENTRY}" > CHANGELOG.md
          fi

      - name: Commit and tag
        if: steps.detect.outputs.change_type != ''
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          git config user.name "Schuby"
          git config user.email "schubydoo@users.noreply.github.com"
          git add VERSION package.json balena.yml CHANGELOG.md
          git commit -m "Release ${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin main
          git push origin "v${NEW_VERSION}"
