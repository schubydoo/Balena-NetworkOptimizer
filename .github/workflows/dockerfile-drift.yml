name: Dockerfile drift check

# Asserts network-optimizer/Dockerfile.template and Dockerfile.ghcr stay
# byte-identical outside the three sanctioned cross-build divergences
# (Stage 1 .NET FROM, Stage go-build, Stage iperf-build). The two files
# diverge here because balena's classic (non-BuildKit) builder can't
# populate BUILDPLATFORM/TARGETARCH, while the GHCR mirror cross-builds
# via buildx for speed (see CLAUDE.md gotcha #7).
#
# Historical motivation: PR #34 was a Renovate bump that updated
# Dockerfile.template's UPSTREAM_VERSION but missed Dockerfile.ghcr,
# which would have shipped a version mismatch if not caught at review.

on:
  pull_request:
    paths:
      - 'network-optimizer/Dockerfile.template'
      - 'network-optimizer/Dockerfile.ghcr'
      - 'scripts/check-dockerfile-drift.sh'
      - '.github/workflows/dockerfile-drift.yml'
  push:
    branches: [main]
    paths:
      - 'network-optimizer/Dockerfile.template'
      - 'network-optimizer/Dockerfile.ghcr'

permissions:
  contents: read

jobs:
  drift:
    name: Check Dockerfile.template vs Dockerfile.ghcr
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run drift check
        run: ./scripts/check-dockerfile-drift.sh
