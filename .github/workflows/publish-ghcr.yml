name: Publish to GHCR

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # softprops/action-gh-release creates the GitHub release
      packages: write  # push image to GHCR
      id-token: write  # cosign keyless signing (OIDC)
    strategy:
      matrix:
        include:
          - service: network-optimizer
            image: ghcr.io/schubydoo/balena-network-optimizer
          - service: network-optimizer-speedtest
            image: ghcr.io/schubydoo/balena-network-optimizer-speedtest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          # The action default pulled QEMU v10.2.1, which SIGABRTs the .NET
          # SDK during `dotnet restore` under arm/v7 emulation (v0.2.1 GHCR
          # build, exit 134). Pin an older, more .NET-stable binfmt/QEMU
          # build. Experiment: if arm/v7 still aborts, drop arm/v7 from the
          # network-optimizer image (balena builds all arches natively for
          # the fleet — GHCR is only a mirror).
          image: tonistiigi/binfmt:qemu-v8.1.5
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        env:
          # Annotate both the per-arch manifests and the multi-arch index so
          # GHCR displays the description on the package page.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile.template
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${{ matrix.image }}@${DIGEST}"

      - name: Generate SPDX SBOM
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ matrix.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.service }}.spdx.json
          artifact-name: ${{ matrix.service }}-sbom.spdx.json

      - name: Publish release with SBOM
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ matrix.service }}.spdx.json
          fail_on_unmatched_files: true
