name: Publish to GHCR

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # softprops/action-gh-release creates the GitHub release
      packages: write  # push image to GHCR
      id-token: write  # cosign keyless signing (OIDC)
    strategy:
      matrix:
        include:
          - service: network-optimizer
            image: ghcr.io/schubydoo/balena-network-optimizer
            # buildx/GHCR-only cross-build variant (Stage 1 pinned to
            # $BUILDPLATFORM). balena uses Dockerfile.template instead.
            dockerfile: network-optimizer/Dockerfile.ghcr
          - service: network-optimizer-speedtest
            image: ghcr.io/schubydoo/balena-network-optimizer-speedtest
            # No .NET; nginx multi-arch builds fine under QEMU as-is.
            dockerfile: network-optimizer-speedtest/Dockerfile.template
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4
        with:
          # QEMU registers binfmt handlers for the cross-arch stages buildx
          # still runs under emulation: the alpine `git clone` in Stage 0
          # and the target-arch runtime/file-copy stage. The heavy compile
          # work (.NET SDK, Go binaries, iperf3 C) all cross-compiles
          # natively on the amd64 runner via --platform=$BUILDPLATFORM, so
          # QEMU's correctness/performance matters far less than it used to.
          # Renovate keeps this image current — see the tonistiigi/binfmt
          # customManager in renovate.json. balena is unaffected: native
          # per-arch workers, no QEMU.
          image: tonistiigi/binfmt:qemu-v10.2.1
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        env:
          # Annotate both the per-arch manifests and the multi-arch index so
          # GHCR displays the description on the package page.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${{ matrix.image }}@${DIGEST}"

      - name: Generate SPDX SBOM
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ matrix.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.service }}.spdx.json
          artifact-name: ${{ matrix.service }}-sbom.spdx.json

      - name: Publish release with SBOM
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ matrix.service }}.spdx.json
          fail_on_unmatched_files: true
