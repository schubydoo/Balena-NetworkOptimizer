name: Publish to GHCR

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # softprops/action-gh-release creates the GitHub release
      packages: write  # push image to GHCR
      id-token: write  # cosign keyless signing (OIDC)
    strategy:
      matrix:
        include:
          - service: network-optimizer
            image: ghcr.io/schubydoo/balena-network-optimizer
            # buildx/GHCR-only cross-build variant (Stage 1 pinned to
            # $BUILDPLATFORM). balena uses Dockerfile.template instead.
            dockerfile: network-optimizer/Dockerfile.ghcr
          - service: network-optimizer-speedtest
            image: ghcr.io/schubydoo/balena-network-optimizer-speedtest
            # No .NET; nginx multi-arch builds fine under QEMU as-is.
            dockerfile: network-optimizer-speedtest/Dockerfile.template
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: step-security/setup-qemu-action@109c6ed9f089be1a250c75fd6a534e30df44e030 # v4.0.0
        with:
          # QEMU is still required: the arm64/arm-v7 runtime, iperf3 (C) and
          # Go stages build under emulation here. The .NET SDK no longer
          # does — Dockerfile.ghcr cross-builds it natively on the amd64
          # runner (--platform=$BUILDPLATFORM), eliminating the old
          # `dotnet restore` SIGABRT (exit 134). The binfmt pin is kept as a
          # harmless stable floor for the remaining QEMU-tolerant steps.
          # balena is unaffected: native per-arch workers, no QEMU.
          image: tonistiigi/binfmt:qemu-v8.1.5
      - uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
      - uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        env:
          # Annotate both the per-arch manifests and the multi-arch index so
          # GHCR displays the description on the package page.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: push
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: step-security/cosign-installer@8c02650536457a1c912424ab6cb9734aa3eceb56 # v4.1.1
      - name: Sign image (keyless)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${{ matrix.image }}@${DIGEST}"

      - name: Generate SPDX SBOM
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ matrix.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.service }}.spdx.json
          artifact-name: ${{ matrix.service }}-sbom.spdx.json

      - name: Publish release with SBOM
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: step-security/action-gh-release@277bfa82abcfdb73e5bbb19e213fd76532ee2be5 # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ matrix.service }}.spdx.json
          fail_on_unmatched_files: true
