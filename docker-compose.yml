# Balena port of Ozark-Connect/NetworkOptimizer.
# Uses prebuilt upstream images from ghcr.io. To upgrade upstream, bump the
# image tags below in their own PR; release with a corresponding VERSION bump.
#
# Configuration model: values under `environment:` are baseline defaults.
# Override per-fleet or per-device in the balenaCloud dashboard
# (Variables → Service variables / Application variables) or via:
#   balena env add KEY VALUE --fleet <slug> [--service <name>]
#   balena env add KEY VALUE --device <uuid> [--service <name>]
# balena does NOT support docker-compose ${VAR:-default} interpolation here.
#
# Operator-required variables (NOT declared below; set via balena):
#   network-optimizer service:
#     APP_PASSWORD                 (required) UI password
#     HOST_IP                      device LAN IP (per-device)
#     HOST_NAME                    device hostname (per-device)
#     REVERSE_PROXIED_HOST_NAME    public hostname if behind a proxy
#     OPENSPEEDTEST_HOST           public hostname for speedtest URL
#     DEMO_MODE_MAPPINGS           rarely used; see upstream docs
#   network-optimizer-speedtest service:
#     HOST_IP, HOST_NAME, OPENSPEEDTEST_HOST, REVERSE_PROXIED_HOST_NAME
#
# Upstream sources:
#   https://github.com/Ozark-Connect/NetworkOptimizer
#   https://github.com/Ozark-Connect/NetworkOptimizer/blob/main/docker/docker-compose.prod.yml

version: '2.4'

volumes:
  data:
  ssh-keys:
  logs:

services:
  network-optimizer:
    image: ghcr.io/ozark-connect/network-optimizer:1.4.3
    network_mode: host
    restart: always
    volumes:
      - data:/app/data
      - ssh-keys:/app/ssh-keys
      - logs:/app/logs
    environment:
      TZ: America/Chicago
      # Bind to localhost only (when fronted by a reverse proxy) or all interfaces.
      BIND_LOCALHOST_ONLY: "false"
      # OpenSpeedTest — port settings are tightly coupled to the host:container
      # port mapping below; changing them via balena vars without also editing
      # the compose `ports:` will break the speedtest service.
      OPENSPEEDTEST_PORT: "3005"
      OPENSPEEDTEST_HTTPS: "false"
      OPENSPEEDTEST_HTTPS_PORT: "443"
      # iperf3 server on port 5201 — opt-in (set Iperf3Server__Enabled=true via fleet var).
      Iperf3Server__Enabled: "false"
      # Logging levels: Trace | Debug | Information | Warning | Error | Critical
      Logging__LogLevel__Default: Information
      Logging__LogLevel__NetworkOptimizer: Information
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8042/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  network-optimizer-speedtest:
    image: ghcr.io/ozark-connect/speedtest:1.4.4
    restart: always
    ports:
      # Host:container. Hardcoded because balena's compose validator rejects
      # ${VAR} interpolation in typed fields. To change the host port, edit here
      # and keep OPENSPEEDTEST_PORT on network-optimizer in sync.
      - "3005:3000"
    sysctls:
      # Raise TCP autotuning ceiling so long-RTT single-stream speedtests aren't rwnd-bound.
      # Without this the container's netns inherits the 6 MB kernel default, capping
      # single-stream throughput at ~rwnd/RTT (~225 Mbps at 100 ms RTT).
      net.ipv4.tcp_rmem: "4096 131072 33554432"
      net.ipv4.tcp_wmem: "4096 65536 33554432"
      net.ipv4.tcp_mtu_probing: "1"
      # Note: tcp_congestion_control intentionally not set. Setting it to bbr hard-fails
      # container start on kernels without the bbr module; sysctls in compose are
      # all-or-nothing. Image entrypoint reports CC state and tells the operator
      # how to enable bbr on the host if desired.
    environment:
      TZ: America/Chicago
      OPENSPEEDTEST_PORT: "3005"
      OPENSPEEDTEST_HTTPS: "false"
      OPENSPEEDTEST_HTTPS_PORT: "443"
